plugins {
    id 'com.android.application'
}
android {
    namespace 'com.ridiitols.gyrolock'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ridiitols.gyrolock'
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-video:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full:6.0.3'
    // FFmpegKit calls this library at runtime; declare explicitly to prevent NoClassDefFoundError.
    implementation 'com.arthenica:smart-exception-java:0.2.1'
    implementation 'com.arthenica:smart-exception-common:0.2.1'
}
